version: 2

sources:
  - name: taxi_raw
    description: "Raw data landed by our ingestion scripts, untransformed."
    schema: taxi_raw
    tables:
      - name: yellow_tripdata
        description: "Yellow taxi trips downloaded from NYC TLC."
        columns:
          - name: tpep_pickup_datetime
            tests:
              - not_null
          - name: tpep_dropoff_datetime
            tests:
              - not_null
          - name: total_amount
            tests:
              - not_null